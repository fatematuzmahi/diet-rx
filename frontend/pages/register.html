<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DietRx</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main class="auth-card"><a class="brand" href="../index.html">DietRx</a>
        <h1>Create your account</h1>
        <form id="register-form"><label>Name<input name="name" required></label><label>Email<input name="email"
                    type="email" required></label><label>Password<input name="password" type="password" minlength="8"
                    required></label><button class="button" type="submit">Register</button>
           <label>Confirm Password<input name="confirm_password" type="password" minlength="8" required></label>
        </form>
        <p>Already registered? <a href="login.html">Login</a></p>
    </main>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
