<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DietRx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<main class="login-container">
    <div class="logo-section">
        <img src="../assets/images/dietrx-logo.png" alt="DietRx Logo" class="dietrx-logo">
    </div>

    <h1 class="page-title">Reset Password</h1>
    <p class="page-subtitle">Choose a new password for your DietRx account.</p>

    <form id="reset-password-form">
        <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="new_password" placeholder="Enter new password" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required>
        </div>
        <p id="form-message" aria-live="polite"></p>
        <button type="submit" class="login-button">Reset Password</button>
    </form>

    <p class="register-text">Remember your password? <a href="login.html">Back to Login</a></p>
</main>

<script>
    const form = document.getElementById("reset-password-form");
    const message = document.getElementById("form-message");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById("new-password").value;
        const confirmPassword = document.getElementById("confirm-password").value;
        if (newPassword !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            return;
        }

        message.textContent = "Please wait...";
        try {
            const response = await fetch("http://127.0.0.1:8000/auth/reset-password", {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ new_password: newPassword, confirm_password: confirmPassword })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Password reset failed.");

            message.textContent = data.message;
            setTimeout(() => { window.location.href = "login.html"; }, 1500);
        } catch (error) {
            message.textContent = error.message;
        }
    });
</script>
</body>
</html>
