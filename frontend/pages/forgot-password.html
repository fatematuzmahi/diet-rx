<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | DietRx</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<main class="login-container">
    <div class="logo-section">
        <img src="../assets/images/dietrx-logo.png" alt="DietRx Logo" class="dietrx-logo">
    </div>

    <h1 class="page-title">Forgot Password</h1>
    <p class="page-subtitle">Enter your registered email address to continue.</p>

    <form id="forgot-password-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your registered email" required autocomplete="email">
        </div>
        <p id="form-message" aria-live="polite"></p>
        <button type="submit" class="login-button">Send Reset Code</button>
    </form>

    <form id="verify-reset-code-form" hidden>
        <div class="form-group">
            <label for="reset-code">Verification Code</label>
            <input type="text" id="reset-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" placeholder="Enter the 6-digit code" required>
        </div>
        <p id="verification-message" aria-live="polite"></p>
        <button type="submit" class="login-button">Verify Code</button>
    </form>

    <p class="register-text">Remember your password? <a href="login.html">Back to Login</a></p>
</main>

<script>
    const forgotForm = document.getElementById("forgot-password-form");
    const verifyForm = document.getElementById("verify-reset-code-form");
    const message = document.getElementById("form-message");
    const verificationMessage = document.getElementById("verification-message");
    let requestedEmail = "";

    forgotForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        requestedEmail = document.getElementById("email").value.trim();
        message.textContent = "Please wait...";

        try {
            const response = await fetch("http://127.0.0.1:8000/auth/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: requestedEmail })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Unable to send reset code.");

            message.textContent = data.message;
            forgotForm.hidden = true;
            verifyForm.hidden = false;
            document.getElementById("reset-code").focus();
        } catch (error) {
            message.textContent = error.message;
        }
    });

    verifyForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        verificationMessage.textContent = "Please wait...";

        try {
            const response = await fetch("http://127.0.0.1:8000/auth/verify-reset-code", {
                method: "POST",
                credentials: "include",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: requestedEmail, code: document.getElementById("reset-code").value.trim() })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || "Invalid verification code.");

            window.location.href = "reset-password.html";
        } catch (error) {
            verificationMessage.textContent = error.message;
        }
    });
</script>
</body>
</html>
